name: Package Linux

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      download_url:
        required: false
        type: string
        default: ''
    secrets:
      SBP_LINUX_UPDATE_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Version to package
        type: string
        required: true
        default: '0.0.0'

permissions:
  contents: read

jobs:
  linux-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: |
          dotnet restore SteamBacklogPicker.sln
          dotnet restore tests/Presentation/SteamBacklogPicker.Linux.Tests/SteamBacklogPicker.Linux.Tests.csproj

      - name: Build Linux project
        run: dotnet build src/Presentation/SteamBacklogPicker.Linux/SteamBacklogPicker.Linux.csproj -c Release --no-restore -f net8.0

      - name: Run Linux tests
        run: dotnet test tests/Presentation/SteamBacklogPicker.Linux.Tests/SteamBacklogPicker.Linux.Tests.csproj -c Release --no-restore -f net8.0

      - name: Download appimagetool
        run: |
          APPIMAGETOOL_DOWNLOAD="${RUNNER_TEMP}/appimagetool-x86_64.AppImage"
          curl --fail --location \
            --output "${APPIMAGETOOL_DOWNLOAD}" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          # Digests from the official GitHub release asset metadata (1.9.1 and 20251108).
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  ${APPIMAGETOOL_DOWNLOAD}" | sha256sum --check
          RUNTIME_DOWNLOAD="${RUNNER_TEMP}/runtime-x86_64"
          curl --fail --location --output "${RUNTIME_DOWNLOAD}" \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64"
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  ${RUNTIME_DOWNLOAD}" | sha256sum --check
          echo "APPIMAGE_RUNTIME_PATH=${RUNTIME_DOWNLOAD}" >> "${GITHUB_ENV}"
          chmod +x "${APPIMAGETOOL_DOWNLOAD}"
          (cd "${RUNNER_TEMP}" && "${APPIMAGETOOL_DOWNLOAD}" --appimage-extract)
          echo "APPIMAGETOOL_PATH=${RUNNER_TEMP}/squashfs-root/AppRun" >> "${GITHUB_ENV}"

      - name: Package Linux artifact and feed
        env:
          VERSION_INPUT: ${{ inputs.version }}
          SBP_LINUX_DOWNLOAD_URL: ${{ inputs.download_url }}
          SBP_LINUX_UPDATE_PRIVATE_KEY: ${{ secrets.SBP_LINUX_UPDATE_PRIVATE_KEY }}
        run: |
          VERSION="${VERSION_INPUT}"
          VERSION="${VERSION:-0.0.0}"

          if [[ -n "${SBP_LINUX_UPDATE_PRIVATE_KEY}" ]]; then
            UPDATE_PRIVATE_KEY_PATH="${RUNNER_TEMP}/sbp-linux-update-private.pem"
            printf '%s' "${SBP_LINUX_UPDATE_PRIVATE_KEY}" > "${UPDATE_PRIVATE_KEY_PATH}"
            chmod 600 "${UPDATE_PRIVATE_KEY_PATH}"
            trap 'rm -f "$UPDATE_PRIVATE_KEY_PATH"' EXIT
            export SBP_LINUX_UPDATE_PRIVATE_KEY_PATH="${UPDATE_PRIVATE_KEY_PATH}"
          fi

          ./scripts/package-linux-appimage.sh "$VERSION" ./artifacts/linux

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-artifacts
          path: |
            artifacts/linux/*.AppImage
            artifacts/linux/*.sha256
            artifacts/linux/linux-appimage-update.json
          if-no-files-found: error
