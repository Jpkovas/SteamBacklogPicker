name: CI Build and Test

on:
  workflow_call:
    inputs:
      version:
        description: Version for release packages
        type: string
        default: '0.0.0'
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.version || 'development' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  common-suite:
    name: Common suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: |
          dotnet restore SteamBacklogPicker.sln
          dotnet restore tests/Presentation/SteamBacklogPicker.Linux.Tests/SteamBacklogPicker.Linux.Tests.csproj

      - name: Build common projects
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/Domain/Domain.csproj -c Release --no-restore -f net8.0
          dotnet build src/Integration/ValveFormatParser/ValveFormatParser.csproj -c Release --no-restore -f net8.0
          dotnet build src/Integration/SteamClientAdapter/SteamClientAdapter.csproj -c Release --no-restore -f net8.0
          dotnet build src/Integration/SteamHooks/SteamHooks.csproj -c Release --no-restore -f net8.0
          dotnet build src/Infrastructure/Telemetry/Telemetry.csproj -c Release --no-restore -f net8.0
          dotnet build src/Infrastructure/SteamDiscovery/SteamDiscovery.csproj -c Release --no-restore -f net8.0
          dotnet build src/Presentation/SteamBacklogPicker.AppCore/SteamBacklogPicker.AppCore.csproj -c Release --no-restore -f net8.0
          dotnet build src/Presentation/SteamBacklogPicker.Linux/SteamBacklogPicker.Linux.csproj -c Release --no-restore -f net8.0

      - name: Run common tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/Domain/Domain.Tests/Domain.Tests.csproj -c Release --no-restore -f net8.0 --logger "trx;LogFileName=Domain.Tests.${{ runner.os }}.trx" --results-directory ./TestResults
          dotnet test tests/Integration/SteamCatalog.Tests/SteamCatalog.Tests.csproj -c Release --no-restore -f net8.0 --logger "trx;LogFileName=SteamCatalog.Tests.${{ runner.os }}.trx" --results-directory ./TestResults
          dotnet test tests/Integration/SteamClientAdapter.Tests/SteamClientAdapter.Tests.csproj -c Release --no-restore -f net8.0 --logger "trx;LogFileName=SteamClientAdapter.Tests.${{ runner.os }}.trx" --results-directory ./TestResults
          dotnet test tests/Integration/SteamHooks.Tests/SteamHooks.Tests.csproj -c Release --no-restore -f net8.0 --logger "trx;LogFileName=SteamHooks.Tests.${{ runner.os }}.trx" --results-directory ./TestResults
          dotnet test tests/Infrastructure/SteamDiscovery.Tests/SteamDiscovery.Tests.csproj -c Release --no-restore -f net8.0 --logger "trx;LogFileName=SteamDiscovery.Tests.${{ runner.os }}.trx" --results-directory ./TestResults
          dotnet test tests/Presentation/SteamBacklogPicker.Linux.Tests/SteamBacklogPicker.Linux.Tests.csproj -c Release --no-restore -f net8.0 --logger "trx;LogFileName=SteamBacklogPicker.Linux.Tests.${{ runner.os }}.trx" --results-directory ./TestResults

      - name: Publish Linux package candidate
        if: runner.os == 'Linux'
        run: |
          dotnet restore src/Presentation/SteamBacklogPicker.Linux/SteamBacklogPicker.Linux.csproj --runtime linux-x64 -p:SelfContained=true
          dotnet publish src/Presentation/SteamBacklogPicker.Linux/SteamBacklogPicker.Linux.csproj \
            --configuration Release \
            --no-restore \
            --framework net8.0 \
            --runtime linux-x64 \
            --self-contained true \
            /p:PublishSingleFile=true \
            /p:IncludeNativeLibrariesForSelfExtract=true \
            --output ./publish/linux

      - name: Upload common test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-common-${{ runner.os }}
          path: TestResults/**/*.trx
          retention-days: 30

  macos-suite:
    name: macOS Swift package
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned Swift dependencies
        run: swift package resolve
      - name: Build and test Swift package
        run: |
          set -euo pipefail
          swift build
          swift test 2>&1 | tee swift-test.log
      - name: Package macOS development app
        env:
          PACKAGE_VERSION: ${{ inputs.version || '0.0.0' }}
        run: bash ./scripts/package-macos-app.sh "$PACKAGE_VERSION" ./artifacts/macos
      - uses: actions/upload-artifact@v4
        with:
          name: steambacklogpicker-macos
          path: |
            artifacts/macos/*.zip
            artifacts/macos/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-swift-test-log
          path: swift-test.log

  windows-suite:
    name: Windows-only suite
    runs-on: windows-latest
    needs: common-suite
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore SteamBacklogPicker.sln

      - name: Build Windows projects
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/Infrastructure/SteamDiscovery/SteamDiscovery.csproj -c Release --no-restore -f net8.0-windows10.0.17763.0
          dotnet build src/Presentation/SteamBacklogPicker.UI/SteamBacklogPicker.UI.csproj -c Release --no-restore -f net8.0-windows10.0.18362.0

      - name: Run Windows-only tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/Infrastructure/SteamDiscovery.Tests/SteamDiscovery.Tests.csproj -c Release --no-restore -f net8.0-windows10.0.17763.0 --logger "trx;LogFileName=SteamDiscovery.Tests.WindowsOnly.trx" --results-directory ./TestResults
          dotnet test tests/Presentation/SteamBacklogPicker.UI.Tests/SteamBacklogPicker.UI.Tests.csproj -c Release --no-restore -f net8.0-windows10.0.18362.0 --logger "trx;LogFileName=SteamBacklogPicker.UI.Tests.WindowsOnly.trx" --results-directory ./TestResults

      - name: Upload Windows-only test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows-only
          path: TestResults/**/*.trx
          retention-days: 30

  test-parity-report:
    name: Publish test parity report
    runs-on: ubuntu-latest
    needs: [common-suite, windows-suite]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: TestResults
          merge-multiple: true

      - name: Generate parity report from TRX results
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          trx_files = sorted(Path("TestResults").glob("**/*.trx"))
          if not trx_files:
              raise SystemExit("No TRX files found under TestResults")

          def layer_for(name: str) -> str:
              if name.startswith("Domain."):
                  return "Domain"
              if name.startswith("SteamDiscovery."):
                  return "Infrastructure"
              if name.startswith(("SteamCatalog.", "SteamClientAdapter.", "SteamHooks.")):
                  return "Integration"
              if name.startswith("SteamBacklogPicker."):
                  return "Presentation"
              return "Other"

          def suite_for(file_name: str) -> str:
              if "WindowsOnly" in file_name:
                  return "Windows-only suite"
              if "ubuntu" in file_name.lower() or "linux" in file_name.lower():
                  return "Linux (common suite)"
              if "windows" in file_name.lower():
                  return "Windows (common suite)"
              return "Unclassified"

          def framework_for(path: Path) -> str:
              text = path.read_text(encoding="utf-8", errors="ignore")
              match = re.search(r"bin[\\/]+Release[\\/]+([^\\/]+)[\\/]+", text)
              return match.group(1) if match else "unknown"

          rows = {}
          for path in trx_files:
              root = ET.parse(path).getroot()
              counters = root.find(".//{*}Counters")
              total = counters.attrib.get("total", "0") if counters is not None else "0"
              failed = counters.attrib.get("failed", "0") if counters is not None else "0"
              # VSTest can leave counters.notExecuted=0 while xUnit emits skipped result records.
              skipped = str(sum(result.attrib.get("outcome") == "NotExecuted"
                                for result in root.findall(".//{*}UnitTestResult")))
              name = path.stem.split(".LinuxUpdateFlow", 1)[0]
              name = re.sub(r"\.(Linux|Windows|WindowsOnly)$", "", name)
              suite = suite_for(path.name)
              layer = layer_for(name)
              framework = framework_for(path)
              cell = f"`{name}` ({framework}, {total} tests, {failed} failed, {skipped} skipped)"
              rows.setdefault(layer, {}).setdefault(suite, []).append(cell)

          suites = ["Linux (common suite)", "Windows (common suite)", "Windows-only suite"]
          layers = ["Domain", "Infrastructure", "Integration", "Presentation", "Other"]
          lines = [
              "# Test parity report by layer",
              "",
              "| Layer | Linux (common suite) | Windows (common suite) | Windows-only suite |",
              "| --- | --- | --- | --- |",
          ]

          for layer in layers:
              if layer not in rows:
                  continue
              cells = []
              for suite in suites:
                  values = rows[layer].get(suite, [])
                  cells.append("<br>".join(sorted(values)) if values else "N/A")
              lines.append(f"| {layer} | {cells[0]} | {cells[1]} | {cells[2]} |")

          lines.extend([
              "",
              "Este relatório foi gerado a partir dos arquivos TRX publicados pelos jobs de teste.",
          ])

          Path("docs/testing").mkdir(parents=True, exist_ok=True)
          Path("docs/testing/test-parity-report.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload parity report
        uses: actions/upload-artifact@v4
        with:
          name: test-parity-report
          path: docs/testing/test-parity-report.md
          retention-days: 30

  build-artifacts:
    name: Build Release Artifacts
    runs-on: windows-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [common-suite, windows-suite, macos-suite]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Package self-contained Windows x64 portable app
      shell: pwsh
      env:
        PACKAGE_VERSION: ${{ inputs.version || '0.0.0' }}
      run: ./scripts/package-windows.ps1 -Version $env:PACKAGE_VERSION -OutputDirectory ./artifacts/windows

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: steambacklogpicker-windows-x64-portable
        path: |
          artifacts/windows/*.zip
          artifacts/windows/*.sha256
        if-no-files-found: error
        retention-days: 7
